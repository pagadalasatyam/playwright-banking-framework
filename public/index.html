<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northwind Bank</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --primary: #2563eb;
        --success: #16a34a;
        --danger: #dc2626;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #111827);
        color: var(--text);
      }

      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      #login-form {
        max-width: 420px;
        margin: 50px auto 0;
      }

      .field {
        display: flex;
        flex-direction: column;
        margin-bottom: 16px;
      }

      label {
        font-size: 0.9rem;
        margin-bottom: 6px;
        color: var(--muted);
      }

      input, select, button {
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        padding: 12px 14px;
        font-size: 1rem;
      }

      input, select {
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover { opacity: 0.96; }

      #dashboard {
        display: none;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .summary-tile {
        background: var(--panel-alt);
        border-radius: 10px;
        padding: 18px;
      }

      .summary-label {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .summary-value {
        margin-top: 8px;
        font-size: 1.8rem;
        font-weight: 700;
      }

      .account-list {
        display: grid;
        gap: 16px;
        margin-top: 20px;
      }

      .account-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel-alt);
        border-radius: 12px;
        padding: 16px 18px;
      }

      .account-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .account-name {
        font-weight: 700;
      }

      .account-id {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .balance {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }

      .status {
        min-height: 22px;
        margin-top: 10px;
        font-size: 0.92rem;
      }

      .status.error { color: var(--danger); }
      .status.success { color: var(--success); }

      .transfer-form {
        margin-top: 28px;
      }

      .inline-fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }

      @media (max-width: 640px) {
        .account-item {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form id="login-form" class="card">
        <h2>Northwind Bank</h2>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="email" value="demo@bank.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" value="password123" required />
        </div>

        <button type="submit">Sign in</button>
        <div id="login-message" class="status" aria-live="polite"></div>
      </form>

      <section id="dashboard" class="card">
        <div class="topbar">
          <div>
            <div class="muted">Welcome back</div>
            <h2 id="user-name">Customer</h2>
          </div>
          <button id="logout-button" type="button">Log out</button>
        </div>

        <div class="summary-grid">
          <div class="summary-tile">
            <div class="summary-label">Total balance</div>
            <div id="total-balance" data-testid="total-balance" class="summary-value">$0.00</div>
          </div>
          <div class="summary-tile">
            <div class="summary-label">Available cash</div>
            <div id="available-cash" class="summary-value">$0.00</div>
          </div>
        </div>

        <h3>Accounts</h3>
        <div id="account-list" class="account-list" data-testid="account-list"></div>

        <form id="transfer-form" class="transfer-form">
          <h3>Transfer funds</h3>
          <div class="inline-fields">
            <div class="field">
              <label for="from-account">From account</label>
              <select id="from-account" required></select>
            </div>
            <div class="field">
              <label for="recipient-name">Recipient</label>
              <input id="recipient-name" type="text" placeholder="Recipient name" required />
            </div>
            <div class="field">
              <label for="transfer-amount">Amount</label>
              <input id="transfer-amount" type="number" step="0.01" min="0.01" placeholder="0.00" required />
            </div>
          </div>
          <button type="submit">Send transfer</button>
          <div id="transfer-message" class="status" aria-live="polite"></div>
        </form>
      </section>
    </div>

    <script>
      const loginForm = document.getElementById('login-form');
      const loginMessage = document.getElementById('login-message');
      const dashboard = document.getElementById('dashboard');
      const userName = document.getElementById('user-name');
      const totalBalance = document.getElementById('total-balance');
      const availableCash = document.getElementById('available-cash');
      const accountList = document.getElementById('account-list');
      const transferForm = document.getElementById('transfer-form');
      const transferMessage = document.getElementById('transfer-message');
      const fromAccount = document.getElementById('from-account');
      const recipientName = document.getElementById('recipient-name');
      const transferAmount = document.getElementById('transfer-amount');

      function formatCurrency(value) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
      }

      function setStatus(element, message, type) {
        element.textContent = message;
        element.className = `status ${type || ''}`.trim();
      }

      function renderAccounts(accounts) {
        const rows = accounts.map((account) => {
          const isNegative = account.balance < 0;
          return `
            <div class="account-item" data-testid="account-row" data-account-id="${account.id}">
              <div class="account-meta">
                <div class="account-name">${account.name}</div>
                <div class="account-id">${account.id}</div>
              </div>
              <div class="balance" style="color: ${isNegative ? '#fca5a5' : '#86efac'};">${formatCurrency(account.balance)}</div>
            </div>
          `;
        }).join('');

        accountList.innerHTML = rows;

        fromAccount.innerHTML = accounts.map((account) => `
          <option value="${account.id}">${account.name} (${account.id})</option>
        `).join('');
      }

      function renderDashboard(data) {
        const accounts = data.accounts || [];
        const total = accounts.reduce((sum, account) => sum + Number(account.balance || 0), 0);
        const available = accounts.filter((account) => account.balance > 0).reduce((sum, account) => sum + Number(account.balance || 0), 0);

        userName.textContent = 'demo@bank.com';
        totalBalance.textContent = formatCurrency(total);
        availableCash.textContent = formatCurrency(available);
        renderAccounts(accounts);
        dashboard.style.display = 'block';
      }

      async function loadAccounts() {
        const response = await fetch('/api/accounts');
        const data = await response.json();
        renderDashboard(data);
      }

      async function handleLogin(event) {
        event.preventDefault();
        const payload = {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        };

        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const result = await response.json();

        if (!result.success) {
          setStatus(loginMessage, result.message, 'error');
          return;
        }

        loginForm.style.display = 'none';
        dashboard.style.display = 'block';
        setStatus(loginMessage, '', '');
        loadAccounts();
      }

      async function handleTransfer(event) {
        event.preventDefault();
        const payload = {
          fromAccountId: fromAccount.value,
          recipient: recipientName.value,
          amount: transferAmount.value,
        };

        const response = await fetch('/api/transfer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const result = await response.json();

        if (!result.success) {
          setStatus(transferMessage, result.message, 'error');
          return;
        }

        setStatus(transferMessage, result.message, 'success');
        recipientName.value = '';
        transferAmount.value = '';
        loadAccounts();
      }

      document.getElementById('logout-button').addEventListener('click', () => {
        dashboard.style.display = 'none';
        loginForm.style.display = 'block';
        setStatus(transferMessage, '', '');
      });

      loginForm.addEventListener('submit', handleLogin);
      transferForm.addEventListener('submit', handleTransfer);
    </script>
  </body>
</html>
